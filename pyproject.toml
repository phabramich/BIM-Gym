[project]
name = "bim-gym"
version = "0.1.0"
description = "RL gym for spatial reasoning on BIM models"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = [
  "torch",
  "transformers>=5.9.0",
  "datasets",
  "peft",
  "accelerate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bim_gym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
